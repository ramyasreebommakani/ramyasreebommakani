
<svg
xmlns="http://www.w3.org/2000/svg"
width="630"
height="411"
viewBox="0 0 630 411">

<defs>

<linearGradient
id="terminalBackground"
x1="0"
y1="0"
x2="1"
y2="1">

<stop
offset="0%"
stop-color="#080b10"/>

<stop
offset="100%"
stop-color="#111827"/>

</linearGradient>


<filter id="terminalGlow">

<feGaussianBlur
stdDeviation="2.4"
result="blur"/>

<feMerge>

<feMergeNode
in="blur"/>

<feMergeNode
in="SourceGraphic"/>

</feMerge>

</filter>


<clipPath id="terminalScreen">

<rect
x="20"
y="55"
width="590"
height="336"
rx="8"/>

</clipPath>

</defs>


<!-- Window -->

<rect
x="0"
y="0"
width="630"
height="411"
rx="18"
fill="url(#terminalBackground)"/>


<rect
x="1"
y="1"
width="628"
height="409"
rx="18"
fill="none"
stroke="#30363d"/>


<!-- macOS title bar -->

